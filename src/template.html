<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Jasmine Dragon</title>
</head>
<body>
    <header>
        <img src="../static/logo.svg" alt="The jasmine dragon logo">
        <nav>
            <button id="bHome">Home</button>
            <button id="bMenu">Menu</button>
            <button id="bReserve">Reserve</button>
        </nav>
    </header>
    <div id="content">
        <div id="reservePage">
            <form class="reserveForm">
                <p class="headerText">Save the date,<br>enjoy real <span class="highlightText">tea</span></p>
                <div class="formItem">
                    <label class="bodyText">First Name</label>
                    <input type="text" placeholder="Toph">
                </div>
                <div class="formItem">
                    <label class="bodyText">Last Name</label>
                    <input type="text" placeholder="Beifong">
                </div>
                <div class="formItem">
                    <label class="bodyText">Reservation Date</label>
                    <input type="date">
                </div>
                <button class="bodyText" type="button">Submit Reservation</button>
            </form>
        </div>
    </div>
</body>
</html>
